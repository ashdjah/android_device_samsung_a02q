name: Build TWRP for SM-A025F

on:
  workflow_dispatch:

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
  MANIFEST_BRANCH: 'twrp-12.1'
  DEVICE_NAME: 'a02q'
  DEVICE_PATH: 'device/samsung/a02q'
  MAKEFILE_NAME: 'twrp_a02q'
  BUILD_TARGET: 'recovery'

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Cleanup & Prepare Disk Space
      run: |
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android || true
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip device-tree-compiler python3 python3-pip git rsync
        sudo pip3 install twrpdtgen

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set Git Config
      run: |
        git config --global user.name "SM-A025F Fix"
        git config --global user.email "twrp-fix@a025f.local"

    - name: Initialize Repo & Sync
      run: |
        mkdir twrp-workspace
        cd twrp-workspace
        repo init --depth=1 --no-repo-verify -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} -g default,-mips,-darwin,-notdefault
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc)

    - name: Copy Device Tree to Workspace
      run: |
        mkdir -p twrp-workspace/${{ env.DEVICE_PATH }}
        cp -r ./* twrp-workspace/${{ env.DEVICE_PATH }}/
        # Remove workspace directory copied into itself
        rm -rf twrp-workspace/${{ env.DEVICE_PATH }}/twrp-workspace

    - name: Build Recovery Image
      run: |
        cd twrp-workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch ${{ env.MAKEFILE_NAME }}-eng
        make ${{ env.BUILD_TARGET }}image -j$(nproc)

    - name: Upload TWRP Recovery Image
      uses: actions/upload-artifact@v3
      with:
        name: TWRP-SM-A025F-recovery-image
        path: twrp-workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
